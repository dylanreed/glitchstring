<div class="footer-content">
    <p>&copy; {{ now.Format "2006" }} {{ .Site.Title }} | Built with <a href="https://gohugo.io/">Hugo</a> and hosted on <a href="https://micro.blog/">Micro.blog</a></p>
    {{ with .Site.Params.social }}
    <div class="social-links">
        {{ range . }}
        <a href="{{ .url }}" title="{{ .name }}" target="_blank" rel="noopener">{{ .icon | safeHTML }}</a>
        {{ end }}
    </div>
    {{ end }}
</div>
