{{ define "main" }}
<article class="post">
    <h1>{{ .Title }}</h1>
    <div class="post-meta">
        <span class="date">{{ .Date.Format "January 2, 2006" }}</span>
        {{ with .Params.tags }}
        <span class="tags">
            {{ range . }}
            <a href="{{ "tags/" | relLangURL }}{{ . | urlize }}">{{ . }}</a>
            {{ end }}
        </span>
        {{ end }}
    </div>
    <div class="content">
        {{ .Content }}
    </div>
</article>
{{ end }}
