{{ define "main" }}
<div class="list-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}
    <p>{{ . }}</p>
    {{ end }}
</div>

<div class="posts-list">
    {{ range .Pages }}
    <article class="post-card">
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        <div class="post-meta">{{ .Date.Format "January 2, 2006" }}</div>
        <p>{{ .Summary }}</p>
        <a href="{{ .Permalink }}" class="read-more">Read more →</a>
    </article>
    {{ end }}
</div>
{{ end }}
